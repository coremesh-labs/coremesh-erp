# Serienbrief (Bundle letter): je Eintrag in letters ein Brief; die übrigen Angaben gelten für alle.
# Die Unterschrift ist eine Bilddatei aus files (Base64), sender.signature nennt sie.
sender:
  name: Erika Beispiel
  street: Musterweg 1
  zip: "12345"
  city: Musterstadt
  contact: { PHONE: 0123 456789, EMAIL: erika.beispiel@example.org }
  bank: { name: Beispielbank, iban: DE00 0000 0000 0000 0000 00, bic: BEISDEXXXXX }
  signature: unterschrift.png
files:
  - name: unterschrift.png
    content: 
date: "2026-11-15"
subject: Wartung der Rauchwarnmelder
text: |
  am 3. Dezember 2026 zwischen 9 und 12 Uhr werden die Rauchwarnmelder im Haus geprüft.

  Bitte ermöglichen Sie den Zugang zur Wohnung oder vereinbaren Sie einen anderen Termin.
letters:
  - recipient:
      persons:
        - { title: Frau, first_name: Monika, last_name: Muster, letter_salutation: Sehr geehrte Frau Muster }
        - { title: Herr, first_name: Peter, last_name: Muster, letter_salutation: Sehr geehrter Herr Muster }
      street: Lindenallee 5
      zip: "12345"
      city: Musterstadt
  - recipient:
      persons:
        - { name: Beispiel GmbH }
      name2: z. Hd. Frau Schulz
      street: Lindenallee 7
      zip: "12345"
      city: Musterstadt
