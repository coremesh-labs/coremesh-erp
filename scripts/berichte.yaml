      - {name: konten_abrechnung, position: 50, label: "Konten Abrechnung (Nachzahlung, Guthaben)", type: TEXT, default_value: "4865-4869"}
      - {name: schema, position: 60, label: "Gliederungsschema der Kosten (leer = erstes der Art Ergebnisrechnung)", type: TEXT, lookup_object: BalanceSheetSchema, lookup_value: code, lookup_label: name}
