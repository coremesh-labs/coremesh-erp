# Berichte für „Skripte und Berichte“ (Modul script): Bilanz, Bewegungsbilanz,
# Mieterliste je Gebäude, Einkünfte aus Vermietung (Anlage V) je Objekt und
# Mieteinnahmen je Mieter nach Zahlungseingang. Einlesen: Skripte → „Importieren …“ (wiederholbar)
# oder console script:import --file=berichte.yaml. Ausgabe über die Vorlage
# BERICHT (Modul template, „Beispiele einrichten“) als PDF, dazu immer CSV.
format: coremesh.scripts
version: 1
scripts:
  - code: KOPFDATEN
    name: "Bibliothek: Kopfdaten und Namen"
    description: |
      Funktionen für andere Skripte (include("KOPFDATEN")): companyHeader(cc) liefert den
      Buchungskreis mit Name und Anschrift seines Geschäftspartners für Kopf- und Fußzeile
      der Vorlagen, partnerName(id) den Namen eines Geschäftspartners (Personen: Vorname Name),
      daysBetween(von, bis) die Tage einschließlich, monthsBetween(von, bis) die Monate
      (je Monat anteilig nach Tagen).
    source: |
      var __names = {};
      function partnerName(id) {
        if (!id) return "";
        if (__names[id] === undefined) {
          var bp = null;
          try { bp = AccessObject("BusinessPartner", "get", {id: id}); } catch (e) { bp = null; }
          __names[id] = !bp ? id : (bp.type === "PERSON" ? ((bp.name2 || "") + " " + bp.name1) : (bp.name1 + " " + (bp.name2 || ""))).trim();
        }
        return __names[id];
      }
      function partnerAddress(id) {
        var l = AccessObject("PartnerAddress", "list", {query: {bp_id: id}}).items || [];
        if (!l.length) return {};
        var best = l[0];
        l.forEach(function (a) { if (a.address_role_code === "MAIN" && (a.is_default || best.address_role_code !== "MAIN")) best = a; });
        var a = AccessObject("PartnerAddressData", "get", {id: best.address_id});
        return {street: ((a.street || "") + " " + (a.house_no || "")).trim(), zip: a.zip_code || "", city: a.city || "", country: a.country || ""};
      }
      function companyHeader(cc) {
        var out = {code: cc, name: "Buchungskreis " + cc};
        var c = AccessObject("CompanyCode", "get", {id: cc});
        if (c.description) out.name = c.description;
        if (c.partner_id) {
          var p = partnerAddress(c.partner_id);
          p.id = c.partner_id; p.name = partnerName(c.partner_id);
          out.partner = p;
        }
        return out;
      }
      function __day(d) { return Date.parse(d + "T00:00:00Z") / 86400000; }
      function daysBetween(from, to) { return Math.round(__day(to) - __day(from)) + 1; }
      function monthsBetween(from, to) {
        var sum = 0, y = Number(from.substring(0, 4)), m = Number(from.substring(5, 7));
        for (;;) {
          var first = y + "-" + (m < 10 ? "0" : "") + m + "-01";
          if (first > to) break;
          var dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
          var last = first.substring(0, 8) + dim;
          var f = from > first ? from : first, t = to < last ? to : last;
          if (f <= t) sum += daysBetween(f, t) / dim;
          if (++m > 12) { m = 1; y++; }
        }
        return Math.round(sum * 100) / 100;
      }
    allowed_calls: |
      *.list
      *.get
    log_runs: ERRORS
    active: true

  - code: BILANZ_DATEN
    name: Bilanz und Bewegungsbilanz (Daten)
    description: |
      Liest Bilanzschema und Bilanzposten des Hauptbuchs (Kontenplan des Buchungskreises) und die
      Salden zum Stichtag und Vergleichsstichtag (AccountBalance.list, Geschäftsjahr des Datums bis
      zum Datum). Aktiva mit dem Saldo, Passiva mit umgekehrtem Vorzeichen; ein Posten mit Quelle
      „Jahresergebnis“ erhält den Saldo der Erfolgskonten. Übergeordnete Posten summieren.
      Bewegungsbilanz: Zunahme Aktiva / Abnahme Passiva = Mittelverwendung, umgekehrt Mittelherkunft.
      Abschnitt „Kontrolle“: Konten ohne Posten und eine Differenz Aktiva − Passiva.
    source: |
      include("KOPFDATEN");
      var cc = params.company_code, stichtag = params.stichtag;
      var vergleich = params.vergleich || ((Number(stichtag.substring(0, 4)) - 1) + "-12-31");
      var bewegung = params.ansicht === "BEWEGUNG";
      var chart = AccessObject("LedgerCompanyConfig", "get", {id: cc}).chart_of_accounts_id;
      var schema = params.schema;
      if (!schema) {
        var sl = (AccessObject("BalanceSheetSchema", "list", {query: {chart_of_accounts_id: chart}}).items || [])
          .filter(function (x) { return (x.kind || "BALANCE") === "BALANCE"; });
        if (!sl.length) throw new Error("Kein Bilanzschema für den Kontenplan " + chart + " – im Hauptbuch unter „Bilanzschemata“ mit „Vorschlag laden …“ anlegen");
        schema = sl[0].code;
      }
      var items = AccessObject("BalanceSheetItem", "list", {query: {schema_code: schema}}).items || [];
      if (!items.length) throw new Error("Bilanzschema " + schema + " hat keine Posten");
      var byCode = {}, roots = [];
      items.forEach(function (it) {
        it.children = []; it.accs = []; it.values = [0, 0];
        it.ranges = (it.accounts || "").split(",").map(function (r) { var p = r.trim().split("-"); return {lo: p[0], hi: p[1] || p[0]}; })
          .filter(function (r) { return r.lo; });
        byCode[it.item_code] = it;
      });
      items.forEach(function (it) { var p = it.parent_code && byCode[it.parent_code]; if (p) p.children.push(it); else roots.push(it); });
      var resultItem = items.filter(function (it) { return it.source === "RESULT"; })[0];
      function match(nr) {
        for (var i = 0; i < items.length; i++) {
          var rs = items[i].ranges;
          for (var j = 0; j < rs.length; j++) {
            var head = nr.substring(0, rs[j].lo.length);
            if (nr.length >= rs[j].lo.length && head >= rs[j].lo && head <= rs[j].hi) return items[i];
          }
        }
        return null;
      }
      function sign(it) { return it.side === "LIABILITIES" ? -1 : 1; }
      function r2(x) { return Math.round(x * 100) / 100; }
      var accounts = {}, unassigned = [];
      [vergleich, stichtag].forEach(function (d, k) {
        var l = AccessObject("AccountBalance", "list", {query: {company_code: cc, fiscal_year: Number(d.substring(0, 4)), date_to: d}}).items || [];
        l.forEach(function (b) {
          var a = accounts[b.account_number];
          if (!a) {
            a = accounts[b.account_number] = {nr: b.account_number, name: b.name, values: [0, 0],
              item: b.account_type === "BALANCE_SHEET" ? match(b.account_number) : resultItem};
            if (a.item) a.item.accs.push(a); else unassigned.push(a);
          }
          a.values[k] += Number(b.balance);
        });
      });
      Object.keys(accounts).forEach(function (nr) {
        var a = accounts[nr];
        if (a.item) for (var k = 0; k < 2; k++) a.item.values[k] += sign(a.item) * a.values[k];
      });
      function total(it) {
        it.children.forEach(function (c) { total(c); it.values[0] += c.values[0]; it.values[1] += c.values[1]; });
        it.values = [r2(it.values[0]), r2(it.values[1])];
      }
      roots.forEach(total);
      function nonzero(v) { return Math.abs(v[0]) >= 0.005 || Math.abs(v[1]) >= 0.005; }
      function byNr(a, b) { return a.nr < b.nr ? -1 : a.nr > b.nr ? 1 : 0; }
      var rows = [], sides = [["ASSETS", "Aktiva"], ["LIABILITIES", "Passiva"]], sums = {};
      var cols;
      if (!bewegung) {
        function emit(it, depth, seite) {
          if (!params.nullzeilen && !nonzero(it.values)) return;
          rows.push({seite: seite, posten: it.label, vorjahr: it.values[0], stichtag: it.values[1], veraenderung: r2(it.values[1] - it.values[0]),
            _indent: depth, _style: it.children.length ? "HEAD" : ""});
          // Konten des Postens (die Erfolgskonten des Jahresergebnisses zeigt die GuV)
          if (params.konten && it.source !== "RESULT") it.accs.sort(byNr).forEach(function (a) {
            var v = [r2(sign(it) * a.values[0]), r2(sign(it) * a.values[1])];
            if (nonzero(v)) rows.push({seite: seite, posten: a.nr + " " + a.name, vorjahr: v[0], stichtag: v[1], veraenderung: r2(v[1] - v[0]), _indent: depth + 1, _style: ""});
          });
          it.children.forEach(function (c) { emit(c, depth + 1, seite); });
        }
        sides.forEach(function (s) {
          var sum = [0, 0];
          roots.filter(function (it) { return it.side === s[0]; }).forEach(function (it) { emit(it, 0, s[1]); sum[0] += it.values[0]; sum[1] += it.values[1]; });
          sums[s[0]] = [r2(sum[0]), r2(sum[1])];
          rows.push({seite: s[1], posten: "Summe " + s[1], vorjahr: sums[s[0]][0], stichtag: sums[s[0]][1], veraenderung: r2(sums[s[0]][1] - sums[s[0]][0]), _indent: 0, _style: "TOTAL"});
        });
        var diff = [r2(sums.ASSETS[0] - sums.LIABILITIES[0]), r2(sums.ASSETS[1] - sums.LIABILITIES[1])];
        unassigned.sort(byNr).forEach(function (a) {
          rows.push({seite: "Kontrolle", posten: "Ohne Bilanzposten: " + a.nr + " " + a.name, vorjahr: r2(a.values[0]), stichtag: r2(a.values[1]), veraenderung: r2(a.values[1] - a.values[0]), _indent: 0, _style: ""});
        });
        if (nonzero(diff) || unassigned.length) {
          rows.push({seite: "Kontrolle", posten: "Differenz Aktiva − Passiva", vorjahr: diff[0], stichtag: diff[1], veraenderung: r2(diff[1] - diff[0]), _indent: 0, _style: "TOTAL"});
        }
        cols = [{field: "seite", label: "Seite"}, {field: "posten", label: "Posten", width: 5},
          {field: "vorjahr", label: formatDate(vergleich), format: "MONEY", width: 1.2},
          {field: "stichtag", label: formatDate(stichtag), format: "MONEY", width: 1.2},
          {field: "veraenderung", label: "Veränderung", format: "MONEY", width: 1.2}];
      } else {
        var flows = {Mittelherkunft: [], Mittelverwendung: []};
        function flow(label, it, v) {
          var d = r2(v[1] - v[0]);
          if (Math.abs(d) < 0.005) return;
          var up = it.side === "LIABILITIES" ? d > 0 : d < 0;
          flows[up ? "Mittelherkunft" : "Mittelverwendung"].push({posten: label, betrag: Math.abs(d)});
        }
        items.filter(function (it) { return !it.children.length; }).forEach(function (it) {
          if (params.konten) it.accs.sort(byNr).forEach(function (a) { flow(a.nr + " " + a.name + " (" + it.label + ")", it, [sign(it) * a.values[0], sign(it) * a.values[1]]); });
          else flow(it.label, it, it.values);
        });
        Object.keys(flows).forEach(function (seite) {
          var sum = 0;
          flows[seite].forEach(function (f) { rows.push({seite: seite, posten: f.posten, betrag: f.betrag, _indent: 0, _style: ""}); sum += f.betrag; });
          sums[seite] = r2(sum);
          rows.push({seite: seite, posten: "Summe " + seite, betrag: sums[seite], _indent: 0, _style: "TOTAL"});
        });
        unassigned.sort(byNr).forEach(function (a) {
          rows.push({seite: "Kontrolle", posten: "Ohne Bilanzposten: " + a.nr + " " + a.name, betrag: r2(a.values[1] - a.values[0]), _indent: 0, _style: ""});
        });
        cols = [{field: "seite", label: "Seite"}, {field: "posten", label: "Posten", width: 6}, {field: "betrag", label: "Betrag", format: "MONEY", width: 1.2}];
      }
      var title = bewegung ? "Bewegungsbilanz" : "Bilanz";
      var msg = bewegung ? "Mittelherkunft " + formatNumber(sums.Mittelherkunft) + " · Mittelverwendung " + formatNumber(sums.Mittelverwendung)
        : "Aktiva " + formatNumber(sums.ASSETS[1]) + " · Passiva " + formatNumber(sums.LIABILITIES[1]);
      if (unassigned.length) msg += " · " + unassigned.length + " Konten ohne Bilanzposten (Abschnitt Kontrolle)";
      return {title: title, message: msg, rows: rows, columns: cols,
        subtitle: "Buchungskreis " + cc + " · Stichtag " + formatDate(stichtag) + " · Vergleich " + formatDate(vergleich) + " · Bilanzschema " + schema,
        data: {company: companyHeader(cc)}};
    allowed_calls: |
      *.list
      *.get
    log_runs: ERRORS
    active: true

  - code: MIETER_DATEN
    name: Mieterliste je Gebäude (Daten)
    description: |
      Alle Mietverhältnisse im Zeitraum je Gebäude, ohne Miete und Nebenkosten: Vertragsarten
      mit der Hauptrolle des Parameters „Rolle“ (Standard TENANT, Mieter), Verträge im Status
      der Liste, Hauptobjekt des Vertrags (Mietobjekt → sein Gebäude), Mieter mit ihrer Gültigkeit.
      Je Abschnitt gleicher Mieter eine Zeile: im Zeitraum von/bis, Tage und Monate (anteilig).
    source: |
      include("KOPFDATEN");
      var cc = params.company_code, jahr = keyDate().substring(0, 4);
      var von = params.von || (jahr + "-01-01"), bis = params.bis || (jahr + "-12-31");
      if (von > bis) throw new Error("Zeitraum: von liegt nach bis");
      var rolle = params.rolle || "TENANT";
      function split(s) { return (s || "").split(",").map(function (x) { return x.trim().toUpperCase(); }).filter(function (x) { return x; }); }
      var statuses = split(params.status || "ACTIVE,TERMINATED"), wanted = split(params.vertragsarten);
      function list(obj, q) { q = q || {}; q.company_code = cc; q.includeHistory = true; return AccessObject(obj, "list", {query: q}).items || []; }
      function group(l, key) { var m = {}; l.forEach(function (x) { (m[x[key]] = m[x[key]] || []).push(x); }); return m; }
      function end(d) { return d || "9999-12-31"; }
      var types = {};
      list("ContractType").forEach(function (t) { if (t.main_role === rolle && (!wanted.length || wanted.indexOf(t.code) >= 0)) types[t.code] = t.name; });
      var buildings = {};
      list("Building").forEach(function (b) {
        var adr = [b.street, [b.zip, b.city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
        // Bezeichnung und Anschrift, ohne die Straße doppelt
        buildings[b.building_id] = !adr ? b.designation : adr.indexOf(b.designation) === 0 ? adr
          : b.designation.indexOf(b.street || "\u0000") >= 0 ? b.designation + ", " + [b.zip, b.city].filter(Boolean).join(" ") : b.designation + " – " + adr;
      });
      var rentObjects = {};
      list("RentObject").forEach(function (o) { rentObjects[o.object_id] = o; });
      var objects = group(list("ContractObject"), "contract_id"), partners = group(list("ContractPartner", {role_code: rolle}), "contract_id");
      var rows = [], houses = {};
      list("Contract").forEach(function (c) {
        if (!types[c.contract_type] || statuses.indexOf(c.status) < 0) return;
        var cFrom = c.valid_from, cTo = end(c.valid_to);
        var objs = (objects[c.contract_id] || []).filter(function (o) { return o.is_main; });
        if (!objs.length) objs = (objects[c.contract_id] || []).slice(0, 1);
        if (!objs.length) objs = [{object_type: "", object_id: "", valid_from: cFrom, valid_to: cTo}];
        objs.forEach(function (o) {
          var f = [von, cFrom, o.valid_from].sort()[2], t = [bis, cTo, end(o.valid_to)].sort()[0];
          if (f > t) return;
          var ro = o.object_type === "RentObject" ? rentObjects[o.object_id] : null;
          var b = ro ? ro.building_id : (o.object_type === "Building" ? o.object_id : "");
          if (params.gebaeude && b !== params.gebaeude) return;
          var tenants = (partners[c.contract_id] || []).map(function (p) { return {id: p.partner_id, from: p.valid_from, to: end(p.valid_to)}; })
            .filter(function (p) { return p.from <= t && p.to >= f; });
          if (!tenants.length) tenants = [{id: c.partner_id, from: f, to: t}];
          // Abschnitte gleicher Mieter: Grenzen aus den Gültigkeiten der Mieter
          var cuts = [f];
          tenants.forEach(function (p) {
            if (p.from > f && p.from <= t) cuts.push(p.from);
            if (p.to >= f && p.to < t) cuts.push(new Date(Date.parse(p.to + "T00:00:00Z") + 86400000).toISOString().substring(0, 10));
          });
          cuts = cuts.sort().filter(function (d, i, a) { return i === 0 || d !== a[i - 1]; });
          var last = null;
          cuts.forEach(function (s, i) {
            var e = i + 1 < cuts.length ? new Date(Date.parse(cuts[i + 1] + "T00:00:00Z") - 86400000).toISOString().substring(0, 10) : t;
            var names = tenants.filter(function (p) { return p.from <= e && p.to >= s; }).map(function (p) { return partnerName(p.id); })
              .filter(function (n, k, a) { return a.indexOf(n) === k; }).join(", ");
            if (last && last.mieter === names) { last.bis = e; return; }
            last = {gebaeude: b ? (buildings[b] || b) : "ohne Gebäude", mietobjekt: ro ? ro.designation + " (" + ro.object_id + ")" : (o.object_id || ""),
              vertrag: c.contract_id, vertragsart: types[c.contract_type], mieter: names, mietbeginn: cFrom, mietende: cTo >= "9999" ? "" : cTo, von: s, bis: e};
            rows.push(last);
          });
          houses[b] = true;
        });
      });
      rows.forEach(function (r) { r.tage = daysBetween(r.von, r.bis); r.monate = monthsBetween(r.von, r.bis); });
      rows.sort(function (a, b) { return a.gebaeude < b.gebaeude ? -1 : a.gebaeude > b.gebaeude ? 1 : a.mietobjekt < b.mietobjekt ? -1 : a.mietobjekt > b.mietobjekt ? 1 : a.von < b.von ? -1 : 1; });
      return {rows: rows, message: rows.length + " Mietverhältnisse in " + Object.keys(houses).length + " Gebäuden",
        subtitle: "Buchungskreis " + cc + " · Zeitraum " + formatDate(von) + " – " + formatDate(bis),
        columns: [{field: "gebaeude", label: "Gebäude"}, {field: "mietobjekt", label: "Mietobjekt", width: 2.8}, {field: "vertrag", label: "Vertrag", width: 1.6},
          {field: "vertragsart", label: "Vertragsart", width: 1.5}, {field: "mieter", label: "Mieter", width: 3},
          {field: "mietbeginn", label: "Mietbeginn", format: "DATE", width: 1.2}, {field: "mietende", label: "Mietende", format: "DATE", width: 1.2},
          {field: "von", label: "Zeitraum von", format: "DATE", width: 1.2}, {field: "bis", label: "Zeitraum bis", format: "DATE", width: 1.2},
          {field: "tage", label: "Tage", format: "INTEGER", width: 0.6}, {field: "monate", label: "Monate", format: "NUMBER", width: 0.8}],
        data: {company: companyHeader(cc)}};
    allowed_calls: |
      *.list
      *.get
    log_runs: ERRORS
    active: true

  - code: ANLAGE_V_DATEN
    name: Einkünfte aus Vermietung und Verpachtung je Objekt (Daten)
    description: |
      Überschussrechnung je Wirtschaftseinheit für ein Geschäftsjahr nach einem Gliederungsschema
      des Hauptbuchs (Art „Ergebnisrechnung“, z. B. ANLAGEV): Einzelposten des führenden Ledgers
      (JournalEntryItem), Konto → erster passender Posten; Einnahmen mit umgekehrtem Vorzeichen.
      Objekt der Buchung: Wirtschaftseinheit (Dimension), Gebäude, Mietobjekt, sonst Hauptobjekt
      des Vertrags; Buchungen ohne Objekt im Abschnitt „ohne Objekt“. „Ausweis“ des Postens
      gliedert je Mietobjekt, Vertrag (AfA: „aus Jahr · Bezeichnung · Satz von Bemessungsgrundlage“)
      oder Konto. Kopf je Objekt aus dem Inhaber (Partnerrolle) und seinen Tags (Finanzamt,
      Steuernummer, Steuer-ID, Kennung des Steuerberaters), Aktenzeichen aus dem Tag am Gebäude.
    source: |
      include("KOPFDATEN");
      var cc = params.company_code, jahr = Number(params.jahr || keyDate().substring(0, 4));
      var euro = params.rundung === "EURO", stichtag = jahr + "-12-31";
      var cfg = AccessObject("LedgerCompanyConfig", "get", {id: cc});
      var chart = cfg.chart_of_accounts_id, ledger = params.ledger || cfg.leading_ledger;
      var schema = params.schema;
      if (!schema) {
        var sl = (AccessObject("BalanceSheetSchema", "list", {query: {chart_of_accounts_id: chart}}).items || [])
          .filter(function (x) { return x.kind === "RESULT"; });
        if (!sl.length) throw new Error("Kein Gliederungsschema der Art Ergebnisrechnung für den Kontenplan " + chart + " – im Hauptbuch unter „Bilanzschemata“ mit „Vorschlag laden …“ anlegen");
        schema = sl[0].code;
      }
      var items = AccessObject("BalanceSheetItem", "list", {query: {schema_code: schema}}).items || [];
      if (!items.length) throw new Error("Gliederungsschema " + schema + " hat keine Posten");
      var byCode = {}, roots = [];
      items.forEach(function (it) {
        it.children = [];
        it.ranges = (it.accounts || "").split(",").map(function (r) { var p = r.trim().split("-"); return {lo: p[0], hi: p[1] || p[0]}; })
          .filter(function (r) { return r.lo; });
        byCode[it.item_code] = it;
      });
      items.forEach(function (it) { var p = it.parent_code && byCode[it.parent_code]; if (p) p.children.push(it); else roots.push(it); });
      var matched = {};
      function match(nr) {
        if (matched[nr] !== undefined) return matched[nr];
        for (var i = 0; i < items.length; i++) {
          var rs = items[i].ranges;
          for (var j = 0; j < rs.length; j++) {
            var head = nr.substring(0, rs[j].lo.length);
            if (nr.length >= rs[j].lo.length && head >= rs[j].lo && head <= rs[j].hi) return (matched[nr] = items[i]);
          }
        }
        return (matched[nr] = null);
      }
      // Konten: Bezeichnung und Art (Erfolgskonto) aus den Salden des Jahres
      var accounts = {};
      (AccessObject("AccountBalance", "list", {query: {company_code: cc, fiscal_year: jahr, date_to: stichtag}}).items || [])
        .forEach(function (b) { accounts[b.account_number] = {name: b.name, pl: b.account_type !== "BALANCE_SHEET"}; });
      // Objekte: Wirtschaftseinheit, ihre Gebäude und Mietobjekte
      function list(obj, q) { q = q || {}; q.company_code = cc; return AccessObject(obj, "list", {query: q}).items || []; }
      var entities = {}, buildings = {}, rentObjects = {};
      list("BusinessEntity").forEach(function (e) { entities[e.entity_id] = e; });
      list("Building").forEach(function (b) { buildings[b.building_id] = b; });
      list("RentObject").forEach(function (o) { rentObjects[o.object_id] = o; });
      function entityOf(type, id) {
        if (!id) return "";
        if (type === "BusinessEntity") return entities[id] ? id : "";
        if (type === "Building") return buildings[id] ? buildings[id].entity_id : "";
        if (type === "RentObject") return rentObjects[id] ? rentObjects[id].entity_id : "";
        return "";
      }
      var contracts = {}, deps = {}, mainObj = {};
      function contract(id) {
        if (contracts[id] === undefined) {
          try { contracts[id] = AccessObject("Contract", "get", {id: cc + "|" + id}); } catch (e) { contracts[id] = null; }
          var objs = [];
          try { objs = AccessObject("ContractObject", "list", {query: {company_code: cc, contract_id: id}}).items || []; } catch (e) { objs = []; }
          var main = objs.filter(function (o) { return o.is_main; })[0] || objs[0];
          mainObj[id] = main ? entityOf(main.object_type, main.object_id) : "";
          var dl = [];
          try { dl = AccessObject("ContractDepreciation", "list", {query: {company_code: cc, contract_id: id, includeHistory: true}}).items || []; } catch (e) { dl = []; }
          dl = dl.filter(function (d) { return d.valid_from <= stichtag; }).sort(function (a, b) { return a.valid_from < b.valid_from ? 1 : -1; });
          deps[id] = dl.length ? {cur: dl[0], first: dl[dl.length - 1]} : null;
        }
        return contracts[id];
      }
      function objectOf(l) {
        return entityOf("BusinessEntity", l.dimension_custom_2) || entityOf("Building", l.dimension_custom_1) ||
          entityOf("RentObject", l.rent_object_id) || (l.rent_contract_id && (contract(l.rent_contract_id), mainObj[l.rent_contract_id])) || "";
      }
      function pct(r) { return formatNumber(Number(r), 2) + " %"; }
      function detailOf(it, l) {
        if (it.detail === "RENT_OBJECT" && l.rent_object_id) {
          var o = rentObjects[l.rent_object_id];
          return {key: "O" + l.rent_object_id, label: o ? o.designation : l.rent_object_id};
        }
        if (it.detail === "CONTRACT" && l.rent_contract_id) {
          var c = contract(l.rent_contract_id), d = deps[l.rent_contract_id];
          var name = c ? c.designation : l.rent_contract_id;
          if (d) name = "aus " + d.first.valid_from.substring(0, 4) + " · " + name + " · " + pct(d.cur.rate) + " von " + formatNumber(Number(d.cur.base_amount), 0);
          return {key: "C" + l.rent_contract_id, label: name};
        }
        if (!it.detail) return null;
        // Ausweis je Konto, auch für Buchungen ohne Mietobjekt bzw. Vertrag
        var a = accounts[l.account_number];
        return {key: "A" + l.account_number, label: a ? a.name : l.account_number};
      }
      // Einzelposten des Jahres
      var dec = null, objects = {}, unassigned = {};
      function obj(id) {
        if (!objects[id]) objects[id] = {id: id, items: {}};
        return objects[id];
      }
      ReadObject("JournalEntryItem", "list", {query: {company_code_id: cc, fiscal_year: jahr, ledger: ledger}}, function (l) {
        var it = match(l.account_number), a = accounts[l.account_number];
        if (!it) { if (a && a.pl) unassigned[l.account_number] = (unassigned[l.account_number] || 0) + Number(l.amount_local_curr); return; }
        if (dec === null) dec = Number(AccessObject("Currency", "get", {id: l.local_currency}).decimals);
        var amt = Number(l.amount_local_curr) * (it.side === "INCOME" ? -1 : 1);
        var o = obj(objectOf(l)), b = o.items[it.item_code] || (o.items[it.item_code] = {sum: 0, details: {}, order: []});
        b.sum += amt;
        var d = detailOf(it, l);
        if (d) {
          if (!b.details[d.key]) { b.details[d.key] = {label: d.label, sum: 0}; b.order.push(d.key); }
          b.details[d.key].sum += amt;
        }
      });
      var f = Math.pow(10, dec === null ? 2 : dec), shown = euro ? 0 : (dec === null ? 2 : dec);
      function val(minor) { var v = minor / f; return euro ? Math.round(v) : Math.round(v * f) / f; }
      function fmt(v) { return formatNumber(v, shown); }
      // Kopf je Objekt: Inhaber (Partnerrolle) und seine Tags, Aktenzeichen am Gebäude
      function tags(type, id, ccTags) {
        var out = {};
        try {
          (AccessObject("Tags", "get", {entity_type: type, entity_id: id, company_code: ccTags || cc, effective_date: stichtag}).values || [])
            .forEach(function (v) { var x = v.value || {}; out[v.tag] = v.option_label || v.ref_label || x.string || x.date || x.amount || (x.integer !== undefined ? String(x.integer) : x.option) || ""; });
        } catch (e) { out = {}; }
        return out;
      }
      var rolle = params.rolle || "OWNER", owners = {};
      function owner(entity) {
        var l = list("RentObjectPartner", {object_id: entity, role_code: rolle, includeHistory: true})
          .filter(function (p) { return p.valid_from <= stichtag && (!p.valid_to || p.valid_to >= jahr + "-01-01"); });
        if (!l.length) return null;
        var id = l[0].partner_id;
        if (!owners[id]) {
          var t = tags("BusinessPartner", id), adr = partnerAddress(id);
          owners[id] = {id: id, name: partnerName(id), street: adr.street || "", zip: adr.zip || "", city: adr.city || "",
            tax_office: t[params.tag_finanzamt || "FINANZAMT"] || "", tax_number: t[params.tag_steuernummer || "STEUERNUMMER"] || "",
            tax_id: t[params.tag_steuer_id || "STEUER_ID"] || "", advisor: t[params.tag_berater || "STB_KENNUNG"] || ""};
        }
        return owners[id];
      }
      function fileNumber(entity) {
        var tag = params.tag_aktenzeichen || "IMMO_EINHEITSWERT_AKTENZEICHEN", nr = "";
        Object.keys(buildings).forEach(function (b) {
          if (!nr && buildings[b].entity_id === entity) nr = tags("Building", cc + "|" + b)[tag] || "";
        });
        Object.keys(rentObjects).forEach(function (r) {
          if (!nr && rentObjects[r].entity_id === entity) nr = tags("RentObject", cc + "|" + r)[tag] || "";
        });
        return nr;
      }
      // Zeilen je Objekt: Posten mit Betrag, darunter der Ausweis (Mietobjekt, Vertrag, Konto)
      var rows = [], out = [], sum = {INCOME: 0, EXPENSE: 0};
      var ids = Object.keys(objects).sort(function (a, b) { return a === "" ? 1 : b === "" ? -1 : a < b ? -1 : 1; });
      ids.forEach(function (id) {
        var o = objects[id], e = entities[id];
        var title = e ? e.designation : "ohne Objekt";
        var adr = e ? [e.street, [e.zip, e.city].filter(Boolean).join(" ")].filter(Boolean).join(", ") : "";
        var lines = [], side = {INCOME: 0, EXPENSE: 0};
        function total(it) {
          var b = o.items[it.item_code], v = 0;
          if (b) {
            b.lines = b.order.map(function (k) { return {label: b.details[k].label, amount: val(b.details[k].sum)}; })
              .filter(function (d) { return d.amount !== 0; })
              .sort(function (x, y) { return x.label < y.label ? -1 : x.label > y.label ? 1 : 0; });
            // Summe der (gerundeten) Ausweiszeilen, damit die Seite aufgeht
            v = b.order.length ? b.lines.reduce(function (s, d) { return s + d.amount; }, 0) : val(b.sum);
          }
          it.children.forEach(function (c) { v += total(c); });
          it.value = Math.round(v * f) / f;
          return it.value;
        }
        function emit(it, depth) {
          if (Math.abs(it.value) < 0.005 && !params.nullzeilen) return;
          var b = o.items[it.item_code];
          if (it.children.length) {
            lines.push({label: it.label, indent: depth, style: "HEAD", detail: "", amount: ""});
            it.children.forEach(function (c) { emit(c, depth + 1); });
            lines.push({label: "Summe " + it.label, indent: depth, style: "TOTAL", detail: "", amount: fmt(it.value)});
          } else if (b && b.lines && b.lines.length) {
            lines.push({label: it.label, indent: depth, style: "ITEM", detail: "", amount: ""});
            b.lines.forEach(function (d, i) {
              lines.push({label: d.label, indent: depth + 1, style: "DETAIL", detail: fmt(d.amount), amount: i === b.lines.length - 1 ? fmt(it.value) : ""});
            });
          } else {
            lines.push({label: it.label, indent: depth, style: "ITEM", detail: "", amount: fmt(it.value)});
          }
          if (!it.children.length) rows.push({objekt: title, posten: it.label, ausweis: "", betrag: it.value, _indent: 0, _style: ""});
          if (b && b.lines && b.lines.length > 1) b.lines.forEach(function (d) { rows.push({objekt: title, posten: it.label, ausweis: d.label, betrag: d.amount, _indent: 1, _style: ""}); });
        }
        roots.forEach(function (it) { side[it.side] += total(it); });
        roots.forEach(function (it) { emit(it, 0); });
        var result = Math.round((side.INCOME - side.EXPENSE) * f) / f;
        lines.push({label: result >= 0 ? "Überschuss" : "Verlust", indent: 0, style: "RESULT", detail: "", amount: fmt(result)});
        rows.push({objekt: title, posten: "Ergebnis", ausweis: "", betrag: result, _indent: 0, _style: "TOTAL"});
        sum.INCOME += side.INCOME; sum.EXPENSE += side.EXPENSE;
        var w = e ? owner(id) : null;
        out.push({id: id, title: title, address: adr, file_number: e ? fileNumber(id) : "", owner: w,
          lines: lines, income: fmt(side.INCOME), expense: fmt(side.EXPENSE), result: fmt(result)});
      });
      Object.keys(unassigned).sort().forEach(function (nr) {
        var a = accounts[nr];
        rows.push({objekt: "Kontrolle", posten: "Ohne Posten: " + nr + " " + (a ? a.name : ""), ausweis: "", betrag: val(unassigned[nr]), _indent: 0, _style: ""});
      });
      var res = Math.round((sum.INCOME - sum.EXPENSE) * f) / f, first = out.filter(function (x) { return x.owner; })[0];
      // „ohne Objekt“: Kopf des (ersten) Inhabers
      out.forEach(function (x) { if (!x.owner && first) x.owner = first.owner; });
      var msg = out.length + " Objekte · Einnahmen " + fmt(sum.INCOME) + " · Werbungskosten " + fmt(sum.EXPENSE) + " · Ergebnis " + fmt(res);
      if (Object.keys(unassigned).length) msg += " · " + Object.keys(unassigned).length + " Erfolgskonten ohne Posten (Abschnitt Kontrolle)";
      return {title: "Ermittlung der Einkünfte aus Vermietung und Verpachtung " + jahr, message: msg, rows: rows,
        subtitle: "Buchungskreis " + cc + " · Geschäftsjahr " + jahr + " · Gliederungsschema " + schema,
        columns: [{field: "objekt", label: "Objekt", width: 2.5}, {field: "posten", label: "Posten", width: 3}, {field: "ausweis", label: "Ausweis", width: 3},
          {field: "betrag", label: "Betrag", format: euro ? "INTEGER" : "MONEY", width: 1.2}],
        data: {company: companyHeader(cc), year: String(jahr), objects: out, owner: first ? first.owner : null,
          totals: {income: fmt(sum.INCOME), expense: fmt(sum.EXPENSE), result: fmt(res)}}};
    allowed_calls: |
      *.list
      *.get
      Tags.get
    log_runs: ERRORS
    active: true

  - code: MIETEINNAHMEN_DATEN
    name: Mieteinnahmen je Mieter nach Zahlungseingang (Daten)
    description: |
      Tatsächliche Einnahmen (Ist) je Mieter und Mietvertrag für ein Jahr aus den offenen Posten des
      Hauptbuchs (OpenItem.list): Eine Sollstellung zählt, soweit sie ausgeglichen ist, im Monat des
      Gegenpostens (Zahlung, im Vorjahr bezahlte Miete im Eröffnungsbeleg); Guthaben, die ausgezahlt
      oder verrechnet wurden, mindern. Spalte nach dem Gegenkonto der Sollstellung (Parameter:
      Kontenbereiche Kaltmiete, NK-Vorauszahlungen, Abrechnung); übrige unter „Sonstiges“.
      Je Objekt (Wirtschaftseinheit) eine Zeile je Mieter mit Wohnung und Zeitraum, dazu je Monat
      Kaltmiete, NK und Gesamt.
    source: |
      include("KOPFDATEN");
      var cc = params.company_code, jahr = Number(params.jahr || keyDate().substring(0, 4));
      var von = jahr + "-01-01", bis = jahr + "-12-31";
      function ranges(s) {
        return (s || "").split(",").map(function (r) { var p = r.trim().split("-"); return {lo: p[0], hi: p[1] || p[0]}; }).filter(function (r) { return r.lo; });
      }
      function inRanges(nr, rs) {
        for (var j = 0; j < rs.length; j++) {
          var head = nr.substring(0, rs[j].lo.length);
          if (nr.length >= rs[j].lo.length && head >= rs[j].lo && head <= rs[j].hi) return true;
        }
        return false;
      }
      var cats = [["km", ranges(params.konten_kaltmiete || "4700-4709,4860-4864")], ["nk", ranges(params.konten_nk || "3290-3299")],
        ["abr", ranges(params.konten_abrechnung || "4865-4869")]];
      function category(acc) {
        for (var i = 0; i < cats.length; i++) if (acc && inRanges(acc, cats[i][1])) return cats[i][0];
        return "sonst";
      }
      function list(obj, q) { q = q || {}; q.company_code = cc; return AccessObject(obj, "list", {query: q}).items || []; }
      var entities = {}, buildings = {}, rentObjects = {}, contracts = {}, mainObj = {};
      list("BusinessEntity").forEach(function (e) { entities[e.entity_id] = e; });
      list("Building").forEach(function (b) { buildings[b.building_id] = b; });
      list("RentObject").forEach(function (o) { rentObjects[o.object_id] = o; });
      list("Contract", {includeHistory: true}).forEach(function (c) { contracts[c.contract_id] = c; });
      list("ContractObject", {includeHistory: true}).forEach(function (o) {
        if (o.is_main || !mainObj[o.contract_id]) mainObj[o.contract_id] = o;
      });
      function entityOf(item) {
        var ro = rentObjects[item.rent_object_id];
        if (ro) return ro.entity_id;
        var mo = mainObj[item.contract_id];
        if (mo && mo.object_type === "RentObject" && rentObjects[mo.object_id]) return rentObjects[mo.object_id].entity_id;
        if (mo && mo.object_type === "Building" && buildings[mo.object_id]) return buildings[mo.object_id].entity_id;
        if (mo && mo.object_type === "BusinessEntity") return mo.object_id;
        return "";
      }
      function unitOf(item) {
        var mo = mainObj[item.contract_id], ro = rentObjects[(mo && mo.object_type === "RentObject" && mo.object_id) || item.rent_object_id];
        if (!ro) return "";
        return [ro.designation, ro.floor, ro.location].filter(Boolean).join(", ");
      }
      var dec = null, f = 100;
      var rows = {}, items = AccessObject("OpenItem", "list", {query: {company_code: cc}}).items || [];
      items.forEach(function (it) {
        if (it.payment || it.account_number === undefined) return;
        if (dec === null) { dec = Number(AccessObject("Currency", "get", {id: it.currency}).decimals); f = Math.pow(10, dec); }
        var cat = category(it.offset_account), sign = it.amount_minor > 0 ? 1 : -1;
        (it.clearings || []).forEach(function (k) {
          var d = k.against_posting_date;
          if (k.method === "REVERSAL" || d < von || d > bis) return;
          var key = it.partner_id + "|" + it.contract_id;
          var r = rows[key];
          if (!r) {
            var c = contracts[it.contract_id] || {};
            var cFrom = c.valid_from || von, cTo = c.valid_to && c.valid_to < "9999" ? c.valid_to : bis;
            r = rows[key] = {entity: entityOf(it), partner: it.partner_id, contract: it.contract_id, unit: unitOf(it),
              from: cFrom > von ? cFrom : von, to: cTo < bis ? cTo : bis, km: 0, nk: 0, abr: 0, sonst: 0, months: []};
            for (var m = 0; m < 12; m++) r.months.push({km: 0, nk: 0, all: 0});
          }
          var v = sign * k.amount_minor, mo = r.months[Number(d.substring(5, 7)) - 1];
          r[cat] += v;
          if (cat === "km") mo.km += v;
          if (cat === "nk") mo.nk += v;
          mo.all += v;
          if (cat === "abr") (r.abrYears = r.abrYears || {})[(it.item_text.match(/(19|20)\d\d/) || [""])[0]] = true;
        });
      });
      function money(minor) { return formatNumber(minor / f, dec === null ? 2 : dec); }
      function signed(minor, r) {
        if (!minor) return formatNumber(0, dec === null ? 2 : dec);
        var years = Object.keys(r.abrYears || {}).filter(Boolean).sort().join(", ");
        return (minor > 0 ? "+ " : "− ") + money(Math.abs(minor)) + (minor > 0 ? " (Nachzahlung" : " (Guthaben") + (years ? " " + years : "") + ")";
      }
      var monthNames = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
      var byEntity = {};
      Object.keys(rows).forEach(function (k) { var r = rows[k]; (byEntity[r.entity] = byEntity[r.entity] || []).push(r); });
      var objects = [], csv = [], total = 0;
      Object.keys(byEntity).sort(function (a, b) { return a === "" ? 1 : b === "" ? -1 : a < b ? -1 : 1; }).forEach(function (id) {
        var e = entities[id], list = byEntity[id];
        list.sort(function (a, b) { return a.unit < b.unit ? -1 : a.unit > b.unit ? 1 : a.from < b.from ? -1 : 1; });
        var sum = {km: 0, nk: 0, abr: 0, sonst: 0, months: []};
        for (var m = 0; m < 12; m++) sum.months.push({km: 0, nk: 0, all: 0});
        var title = e ? e.designation : "ohne Objekt";
        var out = list.map(function (r) {
          var all = r.km + r.nk + r.abr + r.sonst;
          ["km", "nk", "abr", "sonst"].forEach(function (c) { sum[c] += r[c]; });
          r.months.forEach(function (mo, i) { sum.months[i].km += mo.km; sum.months[i].nk += mo.nk; sum.months[i].all += mo.all; });
          var tenant = partnerName(r.partner) + (r.unit ? " (" + r.unit + ")" : "");
          var period = formatDate(r.from).substring(0, 6) + " – " + formatDate(r.to).substring(0, 6);
          csv.push({objekt: title, mieter: tenant, vertrag: r.contract, zeitraum: period, kaltmiete: r.km / f, nk_vorauszahlungen: r.nk / f,
            nk_abrechnung: r.abr / f, sonstiges: r.sonst / f, gesamt: all / f});
          return {tenant: tenant, contract: r.contract, period: period, km: money(r.km), nk: money(r.nk), abr: signed(r.abr, r),
            other: r.sonst ? money(r.sonst) : "", total: money(all),
            months: r.months.map(function (mo) { return {km: money(mo.km), nk: money(mo.nk), all: money(mo.all), empty: !mo.all && !mo.km && !mo.nk}; })};
        });
        var all = sum.km + sum.nk + sum.abr + sum.sonst;
        total += all;
        objects.push({title: title, address: e ? [e.street, [e.zip, e.city].filter(Boolean).join(" ")].filter(Boolean).join(", ") : "",
          rows: out, has_other: sum.sonst !== 0,
          sum: {km: money(sum.km), nk: money(sum.nk), abr: (sum.abr > 0 ? "+ " : sum.abr < 0 ? "− " : "") + money(Math.abs(sum.abr)),
            other: sum.sonst ? money(sum.sonst) : "", total: money(all),
            months: sum.months.map(function (mo) { return {km: money(mo.km), nk: money(mo.nk), all: money(mo.all)}; })}});
      });
      return {title: "Mieteinnahmen " + jahr + " (Ist, nach Zahlungseingang)", rows: csv,
        message: objects.length + " Objekte · " + csv.length + " Mietverhältnisse · Einnahmen " + money(total),
        subtitle: "Buchungskreis " + cc + " · Geschäftsjahr " + jahr + " · nach Zahlungseingang (ausgeglichene Posten)",
        columns: [{field: "objekt", label: "Objekt", width: 2.2}, {field: "mieter", label: "Mieter (Wohnung / Lage)", width: 3}, {field: "vertrag", label: "Vertrag", width: 1.4},
          {field: "zeitraum", label: "Zeitraum", width: 1.3}, {field: "kaltmiete", label: "Kaltmiete (Ist)", format: "MONEY"},
          {field: "nk_vorauszahlungen", label: "NK-Vorauszahlungen (Ist)", format: "MONEY"}, {field: "nk_abrechnung", label: "NK-Sonderzahlungen / Erstattungen", format: "MONEY"},
          {field: "sonstiges", label: "Sonstiges", format: "MONEY"}, {field: "gesamt", label: "Gesamteinnahmen (Ist)", format: "MONEY"}],
        data: {company: companyHeader(cc), year: String(jahr), months: monthNames, objects: objects}};
    allowed_calls: |
      *.list
      *.get
    log_runs: ERRORS
    active: true

reports:
  - code: BILANZ
    name: Bilanz
    description: Bilanz zum Stichtag mit Vergleichsstichtag und Veränderung je Posten (Bilanzschema des Hauptbuchs), wahlweise als Bewegungsbilanz.
    source_kind: SCRIPT
    source_script: BILANZ_DATEN
    section_by: seite
    template: BERICHT
    company_param: company_code
    active: true
    parameters:
      - {name: company_code, position: 10, label: Buchungskreis, type: TEXT, required: true, lookup_object: CompanyCode, lookup_value: code, lookup_label: description}
      - {name: stichtag, position: 20, label: Stichtag, type: DATE, required: true}
      - {name: vergleich, position: 30, label: "Vergleichsstichtag (leer = 31.12. des Vorjahres)", type: DATE}
      - {name: ansicht, position: 40, label: Ansicht, type: SELECT, required: true, default_value: BILANZ, options: "BILANZ=Bilanz\nBEWEGUNG=Bewegungsbilanz (Mittelherkunft und -verwendung)"}
      - {name: konten, position: 50, label: Konten zeigen, type: BOOLEAN}
      - {name: nullzeilen, position: 60, label: Posten ohne Saldo zeigen, type: BOOLEAN}
      - {name: schema, position: 70, label: "Bilanzschema (leer = das des Kontenplans)", type: TEXT, lookup_object: BalanceSheetSchema, lookup_value: code, lookup_label: name}
  - code: MIETERLISTE
    name: Mieterliste je Gebäude
    description: Alle Mieter im Zeitraum je Gebäude mit Mietobjekt, Vertrag und der Zeit im Zeitraum (Tage, Monate) – ohne Miete und Nebenkosten.
    source_kind: SCRIPT
    source_script: MIETER_DATEN
    section_by: gebaeude
    template: BERICHT
    company_param: company_code
    active: true
    parameters:
      - {name: company_code, position: 10, label: Buchungskreis, type: TEXT, required: true, lookup_object: CompanyCode, lookup_value: code, lookup_label: description}
      - {name: von, position: 20, label: "Zeitraum von (leer = 01.01. des Jahres)", type: DATE}
      - {name: bis, position: 30, label: "Zeitraum bis (leer = 31.12. des Jahres)", type: DATE}
      - {name: gebaeude, position: 40, label: "Gebäude (leer = alle)", type: TEXT, lookup_object: Building, lookup_value: building_id, lookup_label: designation}
      - {name: vertragsarten, position: 50, label: "Vertragsarten (Komma-Liste, leer = alle mit der Rolle)", type: TEXT}
