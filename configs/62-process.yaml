# Vorgänge (Modul process): Wiedervermietung, Schadensmeldung, Mieter- und
# Eigentümeranfragen, Eigentümerversammlung … mit Schritten, Fristen,
# Wiedervorlage, Sichten, Hinweisen in der App und Ereignisjournal.
plugins:
  process:
    version: 0.5.1
    # Zeitgeber: eigene Systemanfragen an ProcessSetup.checkDue/pushEvents.
    ingress: true
    databases:
      main: { access: write }        # Tabellen process__* via DBSchema.Init
    settings:
      modules:
        process:
          check_minutes: 60          # Fristen und Wiedervorlagen prüfen (Minuten)
          push_seconds: 15           # Ereignisjournal an den Event-Dispatcher (Sekunden)
