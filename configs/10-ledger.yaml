# Konfiguration der ERP-Plugins. Der Host lädt sie zusätzlich zu den configs des Kerns:
#
#   cd ../coremesh
#   bin/host -config configs,../coremesh-erp/configs
#
# Pfade sind relativ zum Arbeitsverzeichnis des Hosts (../coremesh).
host:
  extra_plugin_dirs: [../coremesh-erp/bin/plugins]

plugins:
  # Hauptbuch (Modul ledger): Kontenpläne, Universal Journal, Vorerfassung, Perioden, Währungen.
  ledger:
    version: 0.13.3
    databases:
      main: { access: write }        # Tabellen ledger__* via DBSchema.Init (+ Kontenplan-Seeds)
