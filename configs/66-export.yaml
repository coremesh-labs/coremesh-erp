# Sichten (Modul export): Dokumente nach festgelegten Kriterien zusammenstellen
# (Sichtarten mit Regeln, gespeicherte Sichten), Datasets je Schlüssel mit Ständen,
# Kennzeichen und Lebensdauer, Inhaltsverzeichnis und Manifest (SHA-256), Ausgabe an
# Ziele (Verzeichnis, zip).
plugins:
  export:
    version: 0.3.0
    databases:
      main: { access: write }        # Tabellen export__* via DBSchema.Init
    settings:
      modules:
        export:
          check_minutes: 15          # Zeitgeber: Datasets erneuern, Lebensdauer prüfen (Minuten)
