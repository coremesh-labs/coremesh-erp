# Immobilienverwaltung (Modul realestate): Wirtschaftseinheiten, Gebäude,
# Mietobjekte (Einheiten, Flächen, Pools, Vertragsobjekte), Bemessungen und
# Kataloge je Buchungskreis. Prüft über den Hook ledger.posting die
# Kontierung rent_object_id (Mietobjekt im Buchungskreis, gültig).
plugins:
  realestate:
    version: 0.3.5
    databases:
      main: { access: write }        # Tabellen realestate__* via DBSchema.Init
    settings:
      modules:
        realestate:
          # Eingegebene IDs müssen mit der ID der übergeordneten Ebene beginnen (true)
          # oder sind frei (false, z. B. übernommene Schlüssel RUG1401). Vorschläge
          # sind immer hierarchisch (LpzBrn1WG001).
          id_prefix_required: false
